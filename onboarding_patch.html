  <!-- Onboarding Script -->
  <script>
  (function(){
    // ── MPA Tutorial (on first canvas hover) ──
    var mpaTutShown=false;
    var gridC=document.getElementById('grid-container');
    if(gridC&&localStorage.getItem('mpaTutorialSeen')!=='true'){
      gridC.addEventListener('mouseenter',function mpaTutHandler(){
        if(mpaTutShown)return;mpaTutShown=true;
        gridC.removeEventListener('mouseenter',mpaTutHandler);
        var ov=document.createElement('div');ov.className='mpa-tutorial-overlay';
        ov.innerHTML='<div class="mpa-tutorial-card"><h3>\ud83c\udfdd\ufe0f Deniz Koruma Alan\u0131 Nas\u0131l \u00c7izilir?</h3>'
          +'<div class="mpa-tut-step"><div class="step-label">Ad\u0131m 1 \u2014 S\u00fcr\u00fckle</div><div class="mpa-demo-area"><span class="mpa-hand">\ud83d\udd90\ufe0f</span><div class="mpa-drag-rect"></div></div><p>Canvas \u00fczerinde fareyi bas\u0131l\u0131 tutarak s\u00fcr\u00fckleyin \u2014 geometrik koruma alan\u0131 olu\u015fur. Stres birikimi %77 azal\u0131r, iyile\u015fme h\u0131z\u0131 3.25x artar.</p></div>'
          +'<div class="mpa-tut-step"><div class="step-label">Ad\u0131m 2 \u2014 Koruma</div><p><span class="mpa-cell-glow"></span><span class="mpa-cell-glow"></span><span class="mpa-cell-glow"></span> Korunan h\u00fccreler ye\u015fil parlak kenarl\u0131kla i\u015faretlenir. Kom\u015fu h\u00fccrelere stres bula\u015fmas\u0131 %70 azal\u0131r.</p></div>'
          +'<div class="mpa-tut-step"><div class="step-label">Ad\u0131m 3 \u2014 Kald\u0131rma</div><p>\u21ba Koruma alan\u0131n\u0131 kald\u0131rmak i\u00e7in Reset butonunu kullan\u0131n veya Protected badge\u0027deki \u2715 Clear All butonuna t\u0131klay\u0131n.</p></div>'
          +'<button class="mpa-tut-btn" id="mpa-tut-close">Anlad\u0131m, Ba\u015flayal\u0131m! \u2192</button></div>';
        gridC.style.position='relative';gridC.appendChild(ov);
        document.getElementById('mpa-tut-close').addEventListener('click',function(){
          ov.remove();localStorage.setItem('mpaTutorialSeen','true');
        });
      });
    }

    // Skip tour if returning user
    if(localStorage.getItem('tourSeen')==='true') return;

    var welcomeEl=document.getElementById('welcome-modal');
    var infoPanel=document.getElementById('info-panel');
    var infoPanelCloseBtn=document.getElementById('info-panel-close-btn');
    var onboardingActive=true;

    welcomeEl.style.display='flex';

    document.getElementById('welcome-about-btn').addEventListener('click',function(){
      welcomeEl.style.display='none';infoPanel.style.display='flex';
    });
    document.getElementById('welcome-skip-btn').addEventListener('click',function(){
      welcomeEl.style.display='none';startTour();
    });
    infoPanelCloseBtn.addEventListener('click',function(){
      infoPanel.style.display='none';if(onboardingActive)startTour();
    });

    // ── 12-Step Tour ──
    var STEPS=[
      {sel:'#badges,#stat-cards',title:'\ud83d\udcca Sim\u00fclasyon Durumu',desc:'Durum paneli sim\u00fclasyonun t\u00fcm kritik metriklerini g\u00f6sterir. <b>Year</b>: sim\u00fclasyon y\u0131l\u0131 (2013\u20132100, 2024 sonras\u0131 projeksiyon). <b>SST</b>: NOAA baz \u00e7izgisinden Deniz Y\u00fczey S\u0131cakl\u0131\u011f\u0131 (\u00b0C). <b>DHW</b>: Derece Is\u0131tma Haftas\u0131 \u2014 NOAA Coral Reef Watch form\u00fcl\u00fcne g\u00f6re a\u011farma e\u015fi\u011fi \u00fczerinde biriken termal stres. <b>Stress</b>: ortalama \u0131zgara stresi (0\u20131). <b>Tick</b>: sim\u00fclasyon ad\u0131m\u0131 (30 tick \u2248 1 y\u0131l). <b>Protected</b>: MPA kapsam\u0131 (%). <b>Dead Colonies</b>, <b>Bleaching</b>, <b>Hot Zone</b>, <b>Recovering %</b> ve <b>2100 Tahmini</b> kartlar\u0131 ger\u00e7ek zamanl\u0131 g\u00fcncellenir.'},
      {sel:'#mini-map-wrap',title:'\ud83d\uddfa\ufe0f Pasifik Mini Haritas\u0131',desc:'Ger\u00e7ek Pasifik Okyanusu koordinatlar\u0131nda 5 NOAA NCRMP izleme b\u00f6lgesini g\u00f6sterir. Her nokta ger\u00e7ek bir izleme istasyonudur \u2014 t\u0131klayarak b\u00f6lge de\u011fi\u015ftirebilirsiniz. Koordinatlar: American Samoa 14.03\u00b0S 170.19\u00b0W, Main Hawaiian Islands 20.76\u00b0N 156.97\u00b0W, Mariana Archipelago 16.50\u00b0N 145.38\u00b0E, NW Hawaiian Islands 25.75\u00b0N 171.51\u00b0W, Pacific Remote Island Areas 5.09\u00b0N 164.03\u00b0W. Mevcut b\u00f6lge ye\u015fil ile vurgulan\u0131r.'},
      {sel:'#region-sel',title:'\ud83c\udf0f B\u00f6lge Se\u00e7imi',desc:'5 ger\u00e7ek NOAA NCRMP izleme b\u00f6lgesinden birini se\u00e7in. Her b\u00f6lgenin farkl\u0131 ba\u015flang\u0131\u00e7 SST, mercan \u00f6rt\u00fcs\u00fc % ve a\u011farma ge\u00e7mi\u015fi vard\u0131r. Veri y\u0131llar\u0131 b\u00f6lgeye g\u00f6re de\u011fi\u015fir (ör. American Samoa: 2013, 2015, 2017, 2019, 2021). B\u00f6lge de\u011fi\u015ftirmek sim\u00fclasyonu o b\u00f6lgenin ger\u00e7ek g\u00f6zlenen ba\u015flang\u0131\u00e7 de\u011ferleriyle s\u0131f\u0131rlar.'},
      {sel:'#temp-slider,#cover-slider',title:'\ud83c\udf21\ufe0f Ba\u015flang\u0131\u00e7 Ko\u015fullar\u0131',desc:'S\u0131cakl\u0131k aral\u0131\u011f\u0131 26\u201334\u00b0C ger\u00e7ek Pasifik SST de\u011fi\u015fkenli\u011fini temsil eder. Mercan \u00f6rt\u00fcs\u00fc 0\u2013100% ba\u015flang\u0131\u00e7taki canl\u0131 mercan oran\u0131d\u0131r. Bunlar ba\u015flang\u0131\u00e7 ko\u015fullar\u0131d\u0131r \u2014 sim\u00fclasyon fizi\u011fe g\u00f6re evrimle\u015ftirir. NOAA American Samoa\u0027da ~28\u00b0C baz \u00e7izgisi \u00f6l\u00e7m\u00fc\u015ft\u00fcr. A\u011farma e\u015fi\u011fi yerel ortalaman\u0131n ~1\u00b0C \u00fczerindedir.'},
      {sel:'#recovery-sel,#budget-slider',title:'\ud83d\udd2c \u0130yile\u015fme Parametreleri',desc:'\u0130yile\u015fme H\u0131z\u0131 (Yava\u015f/Orta/H\u0131zl\u0131) do\u011fal mercan iyile\u015fme oran\u0131n\u0131 kontrol eder \u2014 ger\u00e7ek mercan iyile\u015fmesi a\u011farmadan sonra 10\u201315 y\u0131l s\u00fcrer. Restorasyon B\u00fct\u00e7esi ($0M\u2013$100M) aktif m\u00fcdahaleyi modeller: mercan bah\u00e7ecili\u011fi, frag\u00fcman nakli ve substrat stabilizasyon programlar\u0131. Ger\u00e7ek programlarda $1M yakla\u015f\u0131k 1\u20133 hektar restore edebilir.'},
      {sel:'.btn-group',title:'\u23ef\ufe0f Sim\u00fclasyon Kontrolleri',desc:'<b>Pause</b>: Duraklat\u0131r, haritay\u0131 inceleyin. <b>Play</b>: Normal h\u0131zda ba\u015flat\u0131r. <b>Fast</b>: 3x h\u0131z. <b>Reset</b>: Her \u015feyi s\u0131f\u0131rlar. <b>Compare</b>: \u0130ki b\u00f6lgeyi yan yana \u00e7al\u0131\u015ft\u0131r\u0131r. <b>CSV</b>: Her tick\u0027i kaydeder \u2014 y\u0131l, ay, b\u00f6lge, SST, DHW, stres, mercan %, sa\u011fl\u0131kl\u0131/a\u011farm\u0131\u015f/\u00f6l\u00fc/iyile\u015fen %, bal\u0131k pop\u00fclasyonlar\u0131, koruma % ve t\u00fcm politika de\u011ferleri. Badge say\u0131c\u0131 ka\u00e7 sat\u0131r kaydedildi\u011fini g\u00f6sterir.'},
      {sel:'#policy-body .policy-col:first-child',title:'\ud83c\udfed Emisyon Kaynaklar\u0131',desc:'Her kayd\u0131r\u0131c\u0131n\u0131n bilimsel temeli: <b>K\u00f6m\u00fcr & Sanayi</b> \u2014 k\u00fcresel CO\u2082\u0027nin ~%35\u0027i. <b>Havac\u0131l\u0131k & Gemi</b> \u2014 uluslararas\u0131 ta\u015f\u0131mac\u0131l\u0131k ~%2.5, \u00e7o\u011fu ulusal hedeften hari\u00e7. <b>Hayvanc\u0131l\u0131k & Pirin\u00e7</b> \u2014 tar\u0131msal CH\u2084 metan ~%14.5, 20 y\u0131lda CO\u2082\u0027den 80x g\u00fc\u00e7l\u00fc. <b>Orman Kayb\u0131</b> \u2014 karbon yutaklar\u0131n\u0131 yok eder (Amazon tek ba\u015f\u0131na ~2Gt CO\u2082/y\u0131l emer). <b>Temiz Enerji</b> \u2014 %100\u0027de net emisyonlar \u00f6nemli \u00f6l\u00e7\u00fcde d\u00fc\u015fer. <b>CCS</b> \u2014 \u015fu an gereken k\u00fcresel hacmin <%0.1\u0027ini yakalar, $50\u2013300/ton CO\u2082.'},
      {sel:'#btn-us-policy,#btn-cn-policy,#btn-eu-policy',title:'\ud83c\udf0d \u0130klim Anla\u015fmalar\u0131',desc:'<b>US</b>: Paris Anla\u015fmas\u0131/IRA kat\u0131l\u0131m\u0131. <b>CN</b>: \u00c7in\u0027in 2060 karbon n\u00f6trl\u00fck taahh\u00fcd\u00fc. <b>EU</b>: Avrupa Ye\u015fil Mutabakat hedefleri. Kapat\u0131ld\u0131\u011f\u0131nda \u0131s\u0131nma h\u0131z\u0131 o blo\u011fun modellenen katk\u0131s\u0131 kadar artar. \u00dc\u00e7\u00fc birden kapat\u0131l\u0131rsa modelde 2100\u0027e kadar ~+0.8\u00b0C ek \u0131s\u0131nma olu\u015fur. Her politika ger\u00e7ek d\u00fcnya iklim taahh\u00fctlerini yans\u0131t\u0131r.'},
      {sel:'#policy-body .policy-col:last-child',title:'\ud83c\udf0a Okyanus & Resif Politikalar\u0131',desc:'<b>Alkalinite G\u00fc\u00e7lendirme</b>: Deniz suyuna alkalin mineral ekleyerek pH\u0027\u0131 y\u00fckseltir, a\u011farma e\u015fi\u011fini ~0.5\u00b0C art\u0131rabilir. <b>Turizm D\u00fczenleme</b>: Kontrols\u00fcz turizm fiziksel hasar, g\u00fcne\u015f kremi kirlili\u011fi ve \u00e7apa hasar\u0131 yapar \u2014 s\u0131k\u0131 d\u00fczenleme stres \u00e7arpan\u0131n\u0131 azalt\u0131r. <b>Bal\u0131k\u00e7\u0131l\u0131k Kotas\u0131</b>: A\u015f\u0131r\u0131 avlanma otobur bal\u0131klar\u0131 kald\u0131r\u0131r, algler mercanlar\u0131 bo\u011far. <b>GEF Reef Finance</b>: BM mercan koruma fonu, 2022\u20132026 $1.3B taahh\u00fct. <b>Erken Uyar\u0131</b>: DHW>4 olunca otomatik MPA geni\u015fletme tetikler.'},
      {sel:'#grid-container',wide:true,title:'\ud83e\udeb8 Mercan Haritas\u0131',desc:'24\u00d718 \u0131zgara = 432 ba\u011f\u0131ms\u0131z mercan koloni h\u00fccresi. Her h\u00fccrenin kendi stres de\u011feri her tick g\u00fcncellenir. <b>5 durum</b>: Healthy (stres 0\u20130.25, mavi-ye\u015fil), Stressed (0.25\u20130.55, sar\u0131), Bleached (0.55\u20130.82, turuncu-beyaz), Dead (0.82\u20131.00, koyu k\u0131rm\u0131z\u0131-gri), Recovering (\u00f6zel animasyon). Stres bula\u015fmas\u0131: her h\u00fccre 8 kom\u015fusundan IDW a\u011f\u0131rl\u0131kl\u0131 stres al\u0131r. 3 okyanus ak\u0131nt\u0131 merkezi \u0131s\u0131 da\u011f\u0131l\u0131m\u0131n\u0131 kayd\u0131r\u0131r. Korunan h\u00fccreler (MPA) stresi %77 daha yava\u015f biriktirir. <b>S\u00fcr\u00fckleyerek kendi MPA\u0027n\u0131z\u0131 \u00e7izin!</b>'},
      {sel:'#heatmap-overlay,.chart-header',title:'\ud83c\udf21\ufe0f Is\u0131 Haritas\u0131 Modu',desc:'Herhangi bir grafik ba\u015fl\u0131\u011f\u0131na t\u0131klayarak canvas\u0027\u0131 mercan durum g\u00f6r\u00fcn\u00fcm\u00fcnden s\u00fcrekli renk \u0131s\u0131 haritas\u0131na ge\u00e7irin. SST \u0131s\u0131 haritas\u0131 okyanus ak\u0131nt\u0131lar\u0131ndan etkilenen s\u0131cakl\u0131k gradyan\u0131n\u0131 g\u00f6sterir. Stres \u0131s\u0131 haritas\u0131 termal bas\u0131nc\u0131n en y\u00fcksek oldu\u011fu yerleri g\u00f6sterir. Bu mod ayn\u0131 h\u00fccre verisini kullan\u0131r \u2014 sadece farkl\u0131 g\u00f6rsel kodlamad\u0131r. Geri d\u00f6nmek i\u00e7in \u201c\u2190 CHARTS\u201d butonuna t\u0131klay\u0131n.'},
      {sel:'#charts-stack',title:'\ud83d\udcc8 Veri Grafikleri',desc:'<b>SST/DHW</b>: SST = NOAA NCRMP g\u00f6zlenen baz\u00e7izgisi 2013\u20132023, 2024 sonras\u0131 IPCC SSP2-4.5 lineer interpolasyonu + sin\u00fcs mevsimsel d\u00f6ng\u00fc \u00b11.2\u00b0C; DHW = a\u011farma e\u015fi\u011fini a\u015fan s\u0131cakl\u0131klar\u0131n haftal\u0131k birikimi, NOAA CRW metodolojisi. <b>Coral Cover</b>: (sa\u011fl\u0131kl\u0131+a\u011farm\u0131\u015f+iyile\u015fen)/432\u00d7100. <b>Prey Fish</b>: Lotka-Volterra dP/dt=\u03b1P-\u03b2PQ, K mercan \u00f6rt\u00fcs\u00fcne ba\u011fl\u0131 \u2014 %20 alt\u0131nda pop\u00fclasyon \u00e7\u00f6ker. <b>Predator Fish</b>: dQ/dt=\u03b4PQ-\u03b3Q, avc\u0131 av\u0131 2\u20133 tick gecikmeyle izler.'}
    ];
    var tourIdx=0,spotEl=null,popEl=null,overlayEl=null;

    function startTour(){
      onboardingActive=false;tourIdx=0;
      overlayEl=document.createElement('div');overlayEl.className='tour-overlay';
      document.body.appendChild(overlayEl);showStep();
    }
    function cleanupStep(){if(spotEl){spotEl.remove();spotEl=null;}if(popEl){popEl.remove();popEl=null;}}
    function endTour(){cleanupStep();if(overlayEl){overlayEl.remove();overlayEl=null;}localStorage.setItem('tourSeen','true');}

    function findTarget(sel){
      // Support comma-separated selectors — find first visible one
      var parts=sel.split(',');
      for(var i=0;i<parts.length;i++){var el=document.querySelector(parts[i].trim());if(el&&el.offsetParent!==null)return el;}
      return document.querySelector(parts[0].trim());
    }

    function showStep(){
      cleanupStep();
      if(tourIdx<0||tourIdx>=STEPS.length){endTour();return;}
      var step=STEPS[tourIdx];
      var target=findTarget(step.sel);
      if(!target){tourIdx++;showStep();return;}
      target.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(function(){positionStep(step,target);},400);
    }

    function positionStep(step,target){
      var r=target.getBoundingClientRect();
      var pad=6;

      // Spotlight
      spotEl=document.createElement('div');spotEl.className='tour-spotlight';
      spotEl.style.cssText='position:fixed;top:'+(r.top-pad)+'px;left:'+(r.left-pad)+'px;width:'+(r.width+pad*2)+'px;height:'+(r.height+pad*2)+'px;';
      document.body.appendChild(spotEl);

      // Popover
      popEl=document.createElement('div');
      popEl.className='tour-popover'+(step.wide?' wide':'');
      var isLast=tourIdx===STEPS.length-1;
      var backBtn=tourIdx>0?'<button class="tour-nav-btn" id="tour-back">\u2190 Geri</button>':'<span></span>';
      var nextBtn=isLast?'<button class="tour-nav-btn primary" id="tour-next">Sim\u00fclasyonu Ba\u015flat \ud83e\udeb8</button>':'<button class="tour-nav-btn primary" id="tour-next">\u0130leri \u2192</button>';
      popEl.innerHTML='<h3>'+step.title+'</h3><p>'+step.desc+'</p><div class="tour-counter">'+(tourIdx+1)+' / '+STEPS.length+'</div><div class="tour-nav">'+backBtn+' <span class="tour-skip" id="tour-skip">Turu Atla</span> '+nextBtn+'</div>';

      // Clamp to viewport (10px margin all sides)
      var popW=step.wide?440:320;
      var top=r.bottom+12;
      var left=r.left;
      // If near top, place below
      if(r.top<120) top=r.bottom+12;
      // If near bottom, place above
      else if(r.bottom+220>window.innerHeight) top=Math.max(10,r.top-220);
      // Clamp left
      left=Math.max(10,Math.min(left,window.innerWidth-popW-10));
      // Clamp top
      top=Math.max(10,Math.min(top,window.innerHeight-250));
      popEl.style.cssText='position:fixed;top:'+top+'px;left:'+left+'px;';
      document.body.appendChild(popEl);

      document.getElementById('tour-next').addEventListener('click',function(){tourIdx++;showStep();});
      var sk=document.getElementById('tour-skip');if(sk)sk.addEventListener('click',endTour);
      var bk=document.getElementById('tour-back');if(bk)bk.addEventListener('click',function(){tourIdx--;showStep();});
    }
  })();
  </script>

</body>

</html>
